template:
  name: pipelineTemplateNBug
  identifier: pipelineTemplateNBug
  type: Pipeline
  projectIdentifier: Jira
  orgIdentifier: default
  tags: {}
  spec:
    stages:
      - stage:
          name: stg1
          identifier: stg1
          description: ""
          type: Approval
          spec:
            execution:
              steps:
                - step:
                    name: harness1
                    identifier: harness1
                    type: HarnessApproval
                    timeout: 1d
                    spec:
                      approvalMessage: |-
                        Please review the following information
                        and approve the pipeline progression
                      includePipelineExecutionHistory: true
                      approvers:
                        minimumCount: 1
                        disallowPipelineExecutor: false
                        userGroups: <+input>
                      isAutoRejectEnabled: false
                      approverInputs: []
          tags: {}
      - stage:
          name: stg2
          identifier: stg2
          tags: {}
          template:
            templateRef: stgtemplate_same
            versionLabel: v1
            gitBranch: abc-feature-patch
            templateInputs:
              type: Custom
              spec:
                execution:
                  steps:
                    - step:
                        identifier: ShellScript_1
                        type: ShellScript
                        spec:
                          source:
                            type: Inline
                            spec:
                              script: <+input>
  versionLabel: v34
